openapi: 3.1.0
info: { title: Microsoft Graph - Historico e Auditoria, version: v1 }
servers: [{ url: https://graph.microsoft.com/v1.0 }]
paths:
  /auditLogs/directoryAudits:
    get:
      summary: Eventos de auditoria de diretorio
      security: [{ graphApp: [AuditLog.Read.All] }]
      parameters:
        - { name: $top, in: query, schema: { type: integer, minimum: 1 } }
        - { name: $orderby, in: query, schema: { type: string, enum: [activityDateTime asc] } }
      responses: { '200': { description: Colecao OData paginada de eventos, content: { application/json: { schema: { $ref: '#/components/schemas/DirectoryAuditCollection' } } } }, '403': { $ref: '#/components/responses/GraphError' }, '410': { $ref: '#/components/responses/GraphError' } }
components:
  securitySchemes:
    graphApp:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://login.microsoftonline.com/{tenant}/oauth2/v2.0/token
          scopes: { 'https://graph.microsoft.com/.default': Consentimentos Graph }
  responses:
    GraphError: { description: Erro Microsoft Graph, content: { application/json: { schema: { $ref: '#/components/schemas/GraphError' } } } }
  schemas:
    GraphError: { type: object, required: [error], properties: { error: { type: object, required: [code, message], properties: { code: { type: string }, message: { type: string } } } } }
    DirectoryAuditCollection:
      type: object
      required: [value]
      properties: { '@odata.context': { type: string }, '@odata.nextLink': { type: string, format: uri }, value: { type: array, items: { $ref: '#/components/schemas/DirectoryAudit' } } }
    DirectoryAudit:
      type: object
      properties: { id: { type: string }, activityDateTime: { type: string, format: date-time }, activityDisplayName: { type: string }, category: { type: string }, correlationId: { type: string }, result: { type: string }, resultReason: { type: string }, initiatedBy: { type: object, additionalProperties: true }, targetResources: { type: array, items: { type: object, additionalProperties: true } }, additionalDetails: { type: array, items: { type: object, additionalProperties: true } } }
