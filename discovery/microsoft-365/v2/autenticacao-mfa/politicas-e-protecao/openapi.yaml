  /policies/identitySecurityDefaultsEnforcementPolicy: { get: { summary: Security Defaults; 200 observado no tenant, security: [{ graphApp: [Policy.Read.All] }], responses: { '200': { description: Entidade JSON }, '403': { description: Fonte restrita } } } }
