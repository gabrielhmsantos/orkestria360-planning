openapi: 3.1.0
info: { title: Microsoft Graph — Atividade e Inatividade, version: v1 }
servers: [{ url: https://graph.microsoft.com/v1.0 }]
paths:
  /users:
    get: { summary: Último login por identidade, security: [{ graphApp: [] }], parameters: [{ name: '$select', in: query, schema: { type: string, example: 'id,userPrincipalName,accountEnabled,assignedLicenses,signInActivity' } }], responses: { '200': { description: Coleção JSON paginável, content: { application/json: { schema: { type: object } } } }, '403': { description: Sem licença/permissão para signInActivity } } }
  /auditLogs/signIns:
    get: { summary: Eventos de entrada, security: [{ graphApp: [] }], parameters: [{ name: '$top', in: query, description: 'Primeira página da coleta diária; não seguir nextLink.', schema: { type: integer, maximum: 100, default: 100 } }, { name: '$orderby', in: query, schema: { type: string, example: 'createdDateTime desc' } }, { name: '$filter', in: query, description: 'Somente campos e sintaxe aceitos pelo Graph', schema: { type: string } }], responses: { '200': { description: 'Envelope OData de sign-ins; persistir somente a primeira página de até 100 itens.', content: { application/json: { schema: { $ref: '#/components/schemas/SignInCollection' } } } }, '403': { description: Fonte restrita por permissão/licença }, '429': { description: Throttling; respeitar Retry-After } } }
  /reports/getOffice365ActiveUserDetail(period='{period}'):
    get: { summary: Relatório de uso ativo por usuário, description: 'Seguir Location manualmente sem Authorization e nunca registrar Location ou CSV.', security: [{ graphApp: [] }], parameters: [{ name: period, in: path, required: true, schema: { type: string, enum: [D7, D30, D90, D180] } }], responses: { '302': { description: Sucesso canônico; Location é URL pré-autenticada e temporária de download, headers: { Location: { schema: { type: string, format: uri } } } }, '200': { description: 'Fase de download no host indicado pelo Location; não é resposta do host Graph, não enviar Authorization.', content: { application/octet-stream: { schema: { type: string, format: binary } } } }, '403': { description: Sem Reports.Read.All }, '429': { description: Throttling; respeitar Retry-After } } }
components:
  securitySchemes: { graphApp: { type: oauth2, flows: { clientCredentials: { tokenUrl: 'https://login.microsoftonline.com/{tenant}/oauth2/v2.0/token', scopes: { 'https://graph.microsoft.com/.default': Reports.Read.All e permissões Graph } } } } }
  schemas:
    SignInCollection: { type: object, required: [value], properties: { '@odata.context': { type: string }, '@odata.nextLink': { type: string }, value: { type: array, items: { type: object, required: [id, createdDateTime], properties: { id: { type: string }, createdDateTime: { type: string, format: date-time }, userId: { type: [string, 'null'] }, appId: { type: [string, 'null'] }, ipAddress: { type: [string, 'null'] }, clientAppUsed: { type: [string, 'null'] }, conditionalAccessStatus: { type: [string, 'null'] }, status: { type: object }, deviceDetail: { type: object }, location: { type: object } } } } } }
