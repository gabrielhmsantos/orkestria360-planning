openapi: 3.1.0
info: { title: Microsoft Graph — Contas Privilegiadas, version: v1 }
servers: [{ url: https://graph.microsoft.com/v1.0 }]
paths:
  /directoryRoles: { get: { summary: Roles ativadas, security: [{ graphApp: [] }], responses: { '200': { $ref: '#/components/responses/collection' } } } }
  /directoryRoles/{role-id}/members: { get: { summary: Membros de uma role, security: [{ graphApp: [] }], parameters: [{ name: role-id, in: path, required: true, schema: { type: string } }], responses: { '200': { $ref: '#/components/responses/collection' } } } }
  /roleManagement/directory/roleAssignments: { get: { summary: Atribuições de role, security: [{ graphApp: [] }], responses: { '200': { $ref: '#/components/responses/collection' }, '403': { $ref: '#/components/responses/error' } } } }
  /roleManagement/directory/roleDefinitions: { get: { summary: Definições de role; não usar $top neste tenant, security: [{ graphApp: [] }], responses: { '200': { $ref: '#/components/responses/collection' }, '403': { $ref: '#/components/responses/error' } } } }
  /roleManagement/directory/roleEligibilityScheduleInstances: { get: { summary: Elegibilidades PIM; requer RoleEligibilitySchedule.Read.Directory, security: [{ graphApp: [] }], parameters: [{ name: '$select', in: query, schema: { type: string } }, { name: '$filter', in: query, schema: { type: string } }, { name: '$expand', in: query, schema: { type: string } }], responses: { '200': { description: Coleção OData de elegibilidades; seguir nextLink opaco, content: { application/json: { schema: { $ref: '#/components/schemas/EligibilityCollection' } } } }, '400': { $ref: '#/components/responses/pimLicenseRequired' }, '403': { $ref: '#/components/responses/error' } } } }
  /roleManagement/directory/roleAssignmentScheduleInstances: { get: { summary: Atribuições PIM; requer RoleAssignmentSchedule.Read.Directory, security: [{ graphApp: [] }], parameters: [{ name: '$select', in: query, schema: { type: string } }, { name: '$filter', in: query, schema: { type: string } }, { name: '$expand', in: query, schema: { type: string } }], responses: { '200': { description: Coleção OData de atribuições; seguir nextLink opaco, content: { application/json: { schema: { $ref: '#/components/schemas/AssignmentCollection' } } } }, '400': { $ref: '#/components/responses/pimLicenseRequired' }, '403': { $ref: '#/components/responses/error' } } } }
  /reports/authenticationMethods/userRegistrationDetails: { get: { summary: Cobertura MFA, security: [{ graphApp: [] }], responses: { '200': { $ref: '#/components/responses/collection' }, '403': { $ref: '#/components/responses/error' } } } }
  /identityProtection/riskyUsers: { get: { summary: Usuários em risco; requer Entra P2, security: [{ graphApp: [] }], responses: { '200': { $ref: '#/components/responses/collection' }, '403': { $ref: '#/components/responses/error' } } } }
components:
  securitySchemes: { graphApp: { type: oauth2, flows: { clientCredentials: { tokenUrl: 'https://login.microsoftonline.com/{tenant}/oauth2/v2.0/token', scopes: { 'https://graph.microsoft.com/.default': Consentimentos Graph } } } } }
  responses: { collection: { description: Coleção JSON paginável, content: { application/json: { schema: { $ref: '#/components/schemas/ODataCollection' } } } }, error: { description: Permissão/licença indisponível }, pimLicenseRequired: { description: PIM indisponível por licença; classificar como restricted, content: { application/json: { schema: { $ref: '#/components/schemas/GraphPimLicenseError' } } } } }
  schemas:
    ODataCollection: { type: object, required: [value], properties: { '@odata.context': { type: string }, '@odata.nextLink': { type: string }, value: { type: array, items: { type: object, additionalProperties: true } } } }
    EligibilityCollection: { allOf: [{ $ref: '#/components/schemas/ODataCollection' }, { type: object, properties: { value: { type: array, items: { $ref: '#/components/schemas/EligibilityInstance' } } } }] }
    AssignmentCollection: { allOf: [{ $ref: '#/components/schemas/ODataCollection' }, { type: object, properties: { value: { type: array, items: { $ref: '#/components/schemas/AssignmentInstance' } } } }] }
    EligibilityInstance: { type: object, required: [id, principalId, roleDefinitionId], properties: { id: { type: string }, principalId: { type: string }, roleDefinitionId: { type: string }, directoryScopeId: { type: [string, 'null'] }, appScopeId: { type: [string, 'null'] }, startDateTime: { type: [string, 'null'], format: date-time }, endDateTime: { type: [string, 'null'], format: date-time }, memberType: { type: [string, 'null'] }, roleEligibilityScheduleId: { type: [string, 'null'] } } }
    AssignmentInstance: { type: object, required: [id, principalId, roleDefinitionId], properties: { id: { type: string }, principalId: { type: string }, roleDefinitionId: { type: string }, directoryScopeId: { type: [string, 'null'] }, appScopeId: { type: [string, 'null'] }, startDateTime: { type: [string, 'null'], format: date-time }, endDateTime: { type: [string, 'null'], format: date-time }, memberType: { type: [string, 'null'] }, roleAssignmentScheduleId: { type: [string, 'null'] }, assignmentType: { type: [string, 'null'] }, roleAssignmentOriginId: { type: [string, 'null'] } } }
    GraphPimLicenseError: { type: object, required: [error], properties: { error: { type: object, required: [code, message], properties: { code: { type: string, const: AadPremiumLicenseRequired }, message: { type: string } } } } }
